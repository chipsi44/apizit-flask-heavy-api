services:
  api:
    build:
      context: .
    image: apizit-heavy-ml-api:latest
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        python -m gunicorn --bind 0.0.0.0:5000 --workers 1 --threads 2
        --timeout 180 --access-logfile - --error-logfile - src.app:app
    environment:
      APP_DEBUG: "false"
      APP_LOG_LEVEL: INFO
    ports:
      - "5000:5000"
